# Porter MCP server — Aider config template.
#
# HOW TO APPLY: merge the `mcp-servers:` block below into your Aider config
# file (~/.aider.conf.yml or ./.aider.conf.yml). Replace {{PORTER_TOKEN}}
# with a real Porter access token (mint via the OAuth flow).
#
# UNVERIFIED: key layout per Aider docs 2026-10-11; not tested against a
# live Aider install in this environment. No secrets are stored here.
mcp-servers:
  porter:
    command: python
    args: ["-m", "porter.mcp_stdio"]
    env:
      PORTER_TOKEN: "{{PORTER_TOKEN}}"
