# Porter handoff file — Aider read-only context template, NOT an MCP connection.
#
# HOW TO APPLY:
# 1. Open Porter's /panel/handoff, select your project and preview the briefing.
# 2. Download it as porter-handoff.txt into the Aider project's root directory.
# 3. Merge this `read` entry into that project's .aider.conf.yml, preserving
#    your existing model settings and other read-only files. Launch Aider there.
#    Alternative: aider --read porter-handoff.txt
