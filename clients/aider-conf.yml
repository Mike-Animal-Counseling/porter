# access token, database access or server signing secret is needed to read it.
# Review the exported context before sharing it with your chosen model provider.
# Official config reviewed 2026-10-23:
# https://aider.chat/docs/config/aider_conf.html
# UNVERIFIED: not tested against a live Aider install here.
