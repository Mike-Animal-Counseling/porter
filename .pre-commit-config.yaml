repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check --force-exclude --quiet
        language: system
        types_or: [python, pyi]
        require_serial: true
