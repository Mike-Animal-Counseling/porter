name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -c requirements-lock.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check --quiet .
      - run: python -m pre_commit validate-config
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install build
      - run: python -m build
      - name: Install and check the wheel outside the source tree
        shell: bash
        run: |
          python -m pip install -c requirements-lock.txt dist/*.whl
          cd "$RUNNER_TEMP"
          python -I -c "from importlib.resources import files; import porter; assert porter.__version__; assert sum(p.name.endswith('.sql') for p in files('porter.migrations').iterdir()) == 11; assert files('porter').joinpath('static/css/app.css').is_file()"
          porter-import --help
          python -m pip check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps only — ML extras (transformers/torch) are optional;
          # the test suite stubs them out.
          pip install -c requirements-lock.txt -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: porter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: porter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porter -d porter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTER_TEST_DATABASE_URL: postgresql://porter:ci-only-password@127.0.0.1:5432/porter_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -c requirements-lock.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_postgres_integration.py

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -c requirements-lock.txt -r requirements-test.txt
      - name: Docker acceptance (real Postgres, OAuth, HTTP/stdio MCP, persistence)
        run: python scripts/verify_deployment.py
