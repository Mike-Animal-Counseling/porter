name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps only — ML extras (transformers/torch) are optional;
          # the test suite stubs them out.
          pip install -r api/requirements-test.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Lint (pyflakes)
        run: python -m pyflakes porter scripts
