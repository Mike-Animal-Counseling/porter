services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porter}
      POSTGRES_DB: porter
    volumes:
      - porter-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedder:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        REQ_FILE: requirements-embedder.txt
    command: uvicorn porter.embed_server:app --host 0.0.0.0 --port 8001
    environment:
      EMBEDDER_KIND: ${PORTER_EMBEDDER:-bge-m3}
      HF_HOME: /home/porter/models
      OMP_NUM_THREADS: ${PORTER_EMBED_THREADS:-2}
      MKL_NUM_THREADS: ${PORTER_EMBED_THREADS:-2}
    volumes:
      - porter-models:/home/porter/models   # BGE-M3 cache; about 3.8 GB measured in acceptance
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      # Model download can take minutes on first boot; start_period covers it.
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/healthz', timeout=5).raise_for_status()\""]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Migrations + pool run inside the FastAPI lifespan (porter.main); no
    # separate migrate step needed (scripts/migrate.py stays for manual use).
    command: uvicorn porter.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    environment:
      DATABASE_URL: postgresql://porter:${POSTGRES_PASSWORD:-porter}@db:5432/porter
      PORTER_REPO: postgres
      EMBEDDER_KIND: http
      EMBEDDER_URL: http://embedder:8001
      PORTER_JWT_SECRET: ${PORTER_JWT_SECRET:-}
      PORTER_SETUP_TOKEN: ${PORTER_SETUP_TOKEN:-}
      PORTER_ALLOWED_HOSTS: ${PORTER_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      PORTER_PUBLIC_ORIGIN: ${PORTER_PUBLIC_ORIGIN:-}
      PORTER_APPROVAL_MODE: ${PORTER_APPROVAL_MODE:-tiered}
      PORTER_TRIAGE_MODEL: ${PORTER_TRIAGE_MODEL:-heuristic}
      PORTER_LLM_EXTRACTOR: ${PORTER_LLM_EXTRACTOR:-stub}
      PORTER_OLLAMA_URL: ${PORTER_OLLAMA_URL:-http://host.docker.internal:11434}
      PORTER_OLLAMA_MODEL: ${PORTER_OLLAMA_MODEL:-}
      PORTER_LLM_TIMEOUT: ${PORTER_LLM_TIMEOUT:-30}
      PORTER_WIKI_ENABLED: ${PORTER_WIKI_ENABLED:-0}
      PORTER_SETTINGS_PATH: /home/porter/data/settings.json
      PORTER_SNAPSHOT_DIR: /home/porter/data/snapshots
    volumes:
      - porter-data:/home/porter/data
    ports:
      # Publish the owner app on localhost. Container-forwarded browsers
      # unlock with the setup token at /owner/login.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_healthy

volumes:
  porter-db:
  porter-models:
  porter-data:
